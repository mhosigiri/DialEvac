<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haven Floodplain</title>
<meta name="description" content="Haven's Floodplain X-Ray map: real terrain, day and night by the sun, flood, thunderstorm and hurricane illustrations.">
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:rgba(6,36,44,.82);--ink:#f4f1de;--sub:#9cc6c2;--line:rgba(160,230,230,.16);--accent:#7fe3ff;--fx:none}
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#0a3a45;font-family:"Space Grotesk",system-ui,sans-serif} [hidden]{display:none!important}
  #map{position:absolute;inset:0}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:1;background:var(--fx);transition:background .9s}
  #rain{position:absolute;inset:0;pointer-events:none;z-index:1;width:100%;height:100%}
  .glass{background:var(--bg);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px;transition:background .9s,color .9s}
  .brand{position:absolute;z-index:2;left:16px;top:16px;padding:14px 16px;width:300px;max-width:calc(100% - 32px)}
  .brand .k{font:600 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--sub);text-transform:uppercase}
  .brand h1{margin:6px 0 4px;font-size:24px;line-height:1.05}
  .brand p{margin:0;font-size:13px;line-height:1.45;color:var(--sub)}
  .panel{position:absolute;z-index:2;right:16px;top:16px;width:260px;padding:12px 14px}
  .panel h4{margin:10px 0 6px;font:600 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)} .panel h4:first-child{margin-top:2px}
  .seg{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px}
  .seg button,.chip{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 8px;border-radius:8px;font:600 12.5px/1 "Space Grotesk";color:var(--sub)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg-solid)}
  .chips{display:flex;flex-direction:column;gap:4px}
  .chip{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);color:var(--ink)}
  .chip i{width:10px;height:10px;border-radius:50%;border:2px solid var(--sub)} .chip[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
  .chip small{margin-left:auto;font:500 10.5px "IBM Plex Mono";color:var(--sub)}
  .chip:disabled{opacity:.4;cursor:default}
  .seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent)}
  .sun{margin-top:8px;font:500 11.5px/1.4 "IBM Plex Mono",monospace;color:var(--sub)}
  .legend{position:absolute;z-index:2;left:16px;bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:9px 12px;font:500 12.5px/1 "Space Grotesk"}
  .legend span{display:flex;align-items:center;gap:6px} .legend i{width:11px;height:11px;border-radius:50%;background:var(--c);border:1.5px solid var(--stroke,#fff)}
  .hud{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:16px;padding:8px 12px;font:600 11.5px/1.35 "IBM Plex Mono",monospace;letter-spacing:.03em;font-variant-numeric:tabular-nums;max-width:min(520px,calc(100% - 32px));text-align:center}
  .maplibregl-ctrl-attrib{font-size:10px}
  .feed{font:500 11.5px/1.4 "IBM Plex Mono",monospace;color:var(--sub);display:flex;gap:7px;align-items:baseline}
  .feed::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--sub);transform:translateY(-1px)}
  .feed[data-tone="ok"]::before{background:#3ddc97} .feed[data-tone="alert"]::before{background:#ff2d55} .feed[data-tone="warn"]::before{background:#ffb000}
  .feed[data-tone="alert"]{color:var(--ink)}
  .warns{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:180px;overflow:auto} .warns:empty{display:none}
  .chip.warn i{background:#ff2d55;border-color:#ff2d55} .chip.warn span{display:flex;flex-direction:column;gap:3px;min-width:0} .chip.warn em{font:500 10.5px/1.25 "IBM Plex Mono";font-style:normal;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .chip.warn small{align-self:flex-start}
  .fleet{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font:500 11.5px/1 "IBM Plex Mono",monospace;color:var(--ink)}
  .fleet span{display:flex;align-items:center;gap:5px} .fleet i{width:9px;height:9px;border-radius:50%;border:2.5px solid var(--c)} .fleet .sim{color:var(--sub)}
  .live-pop .maplibregl-popup-content{background:var(--bg-solid,#06242c);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:13px/1.45 "Space Grotesk",system-ui,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .live-pop .maplibregl-popup-tip{display:none} .live-pop .maplibregl-popup-close-button{color:var(--sub);font-size:18px;padding:2px 8px}
  .live-pop .k{font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#ff2d55}
  .live-pop h5{margin:6px 0 4px;font-size:14px;line-height:1.3} .live-pop p{margin:0 0 6px;color:var(--sub)} .live-pop .note{font-size:12px}
  .live-pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 8px;font:500 11.5px/1.4 "IBM Plex Mono",monospace} .live-pop dt{color:var(--sub)} .live-pop dd{margin:0}
  .live-pop a{color:var(--accent);font-weight:600}
  @media (max-width:820px){ .brand{width:auto;right:16px} .brand p{display:none} .panel{top:auto;bottom:60px;width:auto;left:16px} .hud{bottom:auto;top:96px} .legend{bottom:12px;left:12px;right:12px} }
</style>
</head>
<body>
<div id="map"></div><div id="fx"></div><canvas id="rain"></canvas>
<section class="brand glass"><div class="k" id="kicker">Haven · Richardson, TX</div><h1>Floodplain X-Ray</h1><p>Real ground height from USGS elevation data. Low ground is deep teal. All households and hazards are illustrative.</p></section>
<aside class="panel glass" aria-label="Map controls">
  <h4>Live warnings</h4>
  <div class="feed" id="feed" role="status" aria-live="polite">Connecting to live data…</div>
  <div class="warns" id="warns"></div>
  <div class="fleet" id="fleet" aria-label="Response vehicles"></div>
  <h4>Light</h4>
  <div class="seg" id="modeSeg"><button data-m="auto" aria-pressed="true">Auto</button><button data-m="day" aria-pressed="false">Day</button><button data-m="night" aria-pressed="false">Night</button></div>
  <div class="sun" id="sun"></div>
  <h4>Hazards</h4>
  <div class="chips" id="hazards"></div>
  <h4>Motion</h4>
  <div class="seg" id="motionSeg"><button data-v="on" aria-pressed="true">On</button><button data-v="off" aria-pressed="false">Off</button></div>
</aside>
<div class="legend glass" id="legend"></div>
<div class="hud glass" id="hud" hidden></div>
<script src="assets/vendor/maplibre-gl.js"></script>
<script src="assets/base-style.js"></script>
<script src="assets/data.js"></script>
<script src="assets/footprints.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
<script src="assets/sun.js"></script>
<script src="assets/flood.js"></script>
<script src="assets/style.js?v=1"></script>
<script src="assets/app.js?v=4"></script>
<script src="assets/live.js"></script>
<script src="assets/hazard-flood.js"></script>
<script src="assets/hazard-storm.js"></script>
<script src="assets/hazard-hurricane.js"></script>
<script src="assets/live-data.js"></script>
</body>
</html>
