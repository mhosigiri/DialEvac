<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DialEvac · Live Weather</title>
<meta name="description" content="DialEvac live NWS weather and synthetic response demos on one MapLibre terrain map.">
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:rgba(6,36,44,.88);--ink:#f4f1de;--sub:#9cc6c2;--line:rgba(160,230,230,.18);--accent:#7fe3ff;--fx:none}
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0a3a45;font-family:"Space Grotesk",system-ui,sans-serif}[hidden]{display:none!important}
  #map{position:absolute;inset:0}#fx{position:absolute;inset:0;pointer-events:none;z-index:1;background:var(--fx);transition:background .9s}#rain{position:absolute;inset:0;pointer-events:none;z-index:1;width:100%;height:100%}
  .glass{background:var(--bg);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px;transition:background .6s,color .6s}
  .brand{position:absolute;z-index:2;left:16px;top:16px;padding:12px 15px;max-width:330px}.brand .k{font:600 10px/1 "IBM Plex Mono";letter-spacing:.14em;color:var(--sub);text-transform:uppercase}.brand h1{margin:5px 0 2px;font-size:22px}.brand p{margin:0;color:var(--sub);font-size:12px;line-height:1.4}
  .panel{position:absolute;z-index:2;right:16px;top:16px;width:340px;padding:12px 14px;max-height:calc(100% - 32px);overflow:auto}.panel h4{margin:12px 0 6px;font:600 10px/1 "IBM Plex Mono";letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}.panel h4:first-child{margin-top:2px}
  .seg,.actions{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px}.seg button,.action,.chip{all:unset;cursor:pointer;text-align:center;padding:7px 8px;border-radius:8px;font:600 12px/1 "Space Grotesk";color:var(--sub)}.seg button,.action{flex:1}.seg button[aria-pressed="true"],.action.primary{background:var(--ink);color:var(--bg)}button:disabled{opacity:.4;cursor:default}.seg button:focus-visible,.action:focus-visible,.chip:focus-visible{outline:2px solid var(--accent)}
  .chips{display:flex;gap:4px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);color:var(--ink)}.chip i{width:8px;height:8px;border-radius:50%;border:2px solid var(--sub)}.chip[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}.chip small{font:500 9px "IBM Plex Mono";color:var(--sub)}
  .sun,.mono,#demo-db-status{font:500 10.5px/1.45 "IBM Plex Mono";color:var(--sub)}#demo-phase{color:var(--accent)}.live-row{display:flex;gap:8px;align-items:center;margin:8px 0 0;font-size:12px}.live-row input{accent-color:var(--accent)}.live-row .mono{margin-left:auto}
  .feed{font:500 11.5px/1.4 "IBM Plex Mono",monospace;color:var(--sub);display:flex;gap:7px;align-items:baseline}
  .feed::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--sub);transform:translateY(-1px)}
  .feed[data-tone="ok"]::before{background:#3ddc97} .feed[data-tone="alert"]::before{background:#ff2d55} .feed[data-tone="warn"]::before{background:#ffb000}
  .feed[data-tone="alert"]{color:var(--ink)}
  .warns{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:180px;overflow:auto} .warns:empty{display:none}
  .chip.warn{width:100%;padding:7px 8px} .chip.warn i{background:#ff2d55;border-color:#ff2d55} .chip.warn span{display:flex;flex-direction:column;gap:3px;min-width:0} .chip.warn em{font:500 10.5px/1.25 "IBM Plex Mono";font-style:normal;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .chip.warn small{margin-left:auto;align-self:flex-start}
  .fleet{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font:500 11.5px/1 "IBM Plex Mono",monospace;color:var(--ink)}
  .fleet span{display:flex;align-items:center;gap:5px} .fleet i{width:9px;height:9px;border-radius:50%;border:2.5px solid var(--c)} .fleet .sim{color:var(--sub)}
  .live-pop .maplibregl-popup-content{background:var(--bg-solid,#06242c);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:13px/1.45 "Space Grotesk",system-ui,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .live-pop .maplibregl-popup-tip{display:none} .live-pop .maplibregl-popup-close-button{color:var(--sub);font-size:18px;padding:2px 8px}
  .live-pop .k{font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#ff2d55}
  .live-pop h5{margin:6px 0 4px;font-size:14px;line-height:1.3} .live-pop p{margin:0 0 6px;color:var(--sub)}
  .live-pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 8px;font:500 11.5px/1.4 "IBM Plex Mono",monospace} .live-pop dt{color:var(--sub)} .live-pop dd{margin:0}
  .live-pop a{color:var(--accent);font-weight:600}
  .demo{border:1px solid var(--line);border-radius:10px;padding:9px}.demo-select{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}.demo-select .action{border:1px solid var(--line);line-height:1.2}.demo-select .action[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}#demo-phase{margin:4px 0 7px;font:600 10px/1.35 "IBM Plex Mono";letter-spacing:.08em;text-transform:uppercase}
  .queue{display:flex;flex-direction:column;gap:5px;margin-top:8px}.queue-item{border:1px solid var(--line);border-radius:8px;padding:7px;font-size:11px}.queue-item.selected{border-color:#ffb36b;background:rgba(230,107,61,.12)}.queue-item.pending{border-color:#e2b657}.queue-item b,.queue-item span{display:block}.queue-item span{color:var(--sub);font-size:10px;margin-top:2px}.confirmation{margin-top:6px;padding:7px;border-radius:8px;background:rgba(80,190,135,.16);border:1px solid rgba(110,235,165,.45);font-size:10.5px}
  .legend{position:absolute;z-index:2;left:16px;bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 11px;font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);border:1px solid #fff}.hud{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:16px;padding:7px 11px;font:600 10px/1.35 "IBM Plex Mono";max-width:min(620px,calc(100% - 400px));text-align:center}
  .maplibregl-ctrl-attrib{font-size:10px}@media(max-width:820px){.brand{right:16px}.brand p{display:none}.panel{top:auto;bottom:54px;left:10px;right:10px;width:auto;max-height:55%}.legend{display:none}.hud{top:80px;bottom:auto;max-width:calc(100% - 24px)}}
</style>
</head>
<body>
<div id="map"></div><div id="fx"></div><canvas id="rain"></canvas>
<section class="brand glass"><div class="k">DialEvac · United States</div><h1 id="view-title">Live Weather</h1><p id="view-subtitle">Official NWS warning boundaries on the existing terrain map.</p></section>
<aside class="panel glass" aria-label="Map controls">
  <h4>Live warnings</h4>
  <div class="feed" id="feed" role="status" aria-live="polite">Connecting to live data…</div>
  <div class="warns" id="warns"></div>
  <div class="fleet" id="fleet" aria-label="Response vehicles"></div>
  <label class="live-row"><input id="radar" type="checkbox"> IEM radar <span class="mono" id="radar-meta">IEM N0Q · off by default</span></label>
  <h4>Light</h4>
  <div class="seg" id="modeSeg"><button data-m="auto" aria-pressed="true">Auto</button><button data-m="day" aria-pressed="false">Day</button><button data-m="night" aria-pressed="false">Night</button></div>
  <div class="sun" id="sun"></div>
  <h4>Map layers</h4><div class="chips" id="hazards"></div>
  <h4>Run Demo</h4>
  <div class="demo">
    <div class="demo-select"><button class="action" data-demo="tornado" aria-pressed="false">Richardson Tornado</button><button class="action" data-demo="hurricane" aria-pressed="false">Hurricane Aftermath</button></div>
    <div id="demo-phase">Live Weather</div><div id="demo-db-status">local demo connecting…</div>
    <div class="actions"><button class="action primary" id="run-demo" disabled>Run Demo</button><button class="action" id="reset-demo" disabled>Reset</button><button class="action" id="return-live" disabled>Return to Live</button></div>
    <div id="dispatcher-queue" class="queue" hidden></div><div id="ride-confirmation" class="confirmation" hidden></div>
  </div>
  <h4>Motion</h4><div class="seg" id="motionSeg"><button data-v="on" aria-pressed="true">On</button><button data-v="off" aria-pressed="false">Off</button></div>
</aside>
<div class="legend glass" id="legend"></div><div class="hud glass" id="hud" hidden></div>
<script src="assets/vendor/maplibre-gl.js"></script><script src="assets/base-style.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script><script src="assets/sun.js"></script><script src="assets/style.js?v=2"></script>
<script src="assets/app.js?v=9"></script><script src="assets/relief.js"></script><script src="assets/hazard-flood.js"></script><script src="assets/hazard-storm.js"></script><script src="assets/richardson-simulation.js?v=3"></script><script src="assets/hazard-hurricane.js"></script>
<script src="assets/spacetime.js"></script><script src="assets/hazard-tornado.js?v=9"></script><script src="assets/profile.js?v=2"></script>
</body>
</html>
