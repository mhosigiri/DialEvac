name: dialevac-demo

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      INBOX_UPSTREAM: inbox:8080
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data

  inbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: services
    command: ["npm", "run", "-s", "voice"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ../.env
        required: false
    environment:
      VOICE_PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    volumes:
      - inbox_spool:/app/services/.spacetime

  routes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: services
    command: ["npm", "run", "-s", "routes"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ../.env
        required: false
    environment:
      OSMNX_ROUTER_URL: http://router:8800
    depends_on:
      router:
        condition: service_healthy

  router:
    build:
      context: ../dispatch
      dockerfile: Dockerfile.router
    restart: unless-stopped
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8800/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    volumes:
      - osm_cache:/data/osmnx

volumes:
  caddy_data:
  inbox_spool:
  osm_cache:
